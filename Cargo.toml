[package]
name        = "trios-mcp"
version     = "0.1.0"
edition     = "2021"
authors     = ["Dmitrii Vasilev <gHashTag>"]
license     = "Apache-2.0"
description = "MCP server wrapping the tri and trios-igla CLIs from trios-trainer-igla. R5-honest passthrough of exit codes, stdout, stderr. Anchor: phi^2 + phi^-2 = 3."
repository  = "https://github.com/gHashTag/trios-mcp"
homepage    = "https://github.com/gHashTag/trios-mcp"
readme      = "README.md"
keywords    = ["mcp", "trinity", "trios", "igla", "gate2"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "trios-mcp"
path = "src/main.rs"

[dependencies]
anyhow             = "1.0"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
